[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shipment-pulse-lakehouse"
version = "0.1.0"
description = "Event driven logistics data platfrom built with Databricks and PySpark"
readme = "README.md"
requires-python = ">3.11,<3.13"
dependencies = [
    "faker>=30,<50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"